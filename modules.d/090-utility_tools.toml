[scripts]
# 脚本集合，键值对
ssh_management = "bash <(curl -sL raw.githubusercontent.com/NodeSeekDev/NodeScriptKit/refs/heads/main/shell_scripts/utility_tools/ssh_management.sh)"
crontab_management = "bash <(curl -sL raw.githubusercontent.com/NodeSeekDev/NodeScriptKit/refs/heads/main/shell_scripts/utility_tools/crontab_management.sh)"
hostname_management = "bash <(curl -sL raw.githubusercontent.com/NodeSeekDev/NodeScriptKit/refs/heads/main/shell_scripts/utility_tools/hostname_management.sh)"
ports_management = "bash <(curl -sL raw.githubusercontent.com/NodeSeekDev/NodeScriptKit/refs/heads/main/shell_scripts/utility_tools/ports_management.sh)"
auto_mount_disk = "bash <(curl -sL raw.githubusercontent.com/NodeSeekDev/NodeScriptKit/refs/heads/main/shell_scripts/utility_tools/auto_mount_disk.sh)"
geek_prompt = "bash <(curl -sL raw.githubusercontent.com/NodeSeekDev/NodeScriptKit/refs/heads/main/shell_scripts/utility_tools/geek_prompt.sh)"
# ⬇️ 新增加的 BBR 脚本路径
bbr_tune = "bash /etc/nsk/shell_scripts/custom/bbr_tune.sh"

[[menus]]
id = "utility_tools"
title = "实用工具"
sub_menus = [
  'ssh_management',
  'crontab_management',
  'ports_management',
  'hostname_management',
  'auto_mount_disk',
  'geek_prompt',
  'bbr_tune', # ⬇️ 新增加的子菜单项
]

[[menus]]
id = "ssh_management"
title = "SSH 管理"
script = "ssh_management"

[[menus]]
id = "crontab_management"
title = "Crontab 管理"
script = "crontab_management"

[[menus]]
id = "ports_management"
title = "端口管理"
script = "ports_management"

[[menus]]
id = "hostname_management"
title = "修改主机名称"
script = "hostname_management"

[[menus]]
id = "auto_mount_disk"
title = "挂载磁盘管理"
script = "auto_mount_disk"

[[menus]]
id = "geek_prompt"
title = "Geek Prompt 美化终端"
script = "geek_prompt"

# ⬇️ 新增加的 BBR 菜单按钮配置
[[menus]]
id = "bbr_tune"
title = "BBR 网络加速优化"
script = "bbr_tune"
