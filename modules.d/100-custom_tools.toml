sub_menus = [
    "bbr_tune_item", # 以后想加新脚本，就在这里往下排队
]

[[menus]]
# 3. 具体的功能按钮
id = "bbr_tune_item"
title = "BBR 网络加速优化"
script = "bbr_tune_cmd"
